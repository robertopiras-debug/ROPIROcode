<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheda degustazione formaggi</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2622; --muted:#7a6f65; --line:#e6dfd5;
  --accent:#d9791a; --accent-ink:#ffffff; --accent-soft:#fbe9d4;
  --ok:#3f8a4f; --warn:#b3402a; --chip:#f3eee6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1714; --card:#25211d; --ink:#f1ebe3; --muted:#a69a8d; --line:#3a342e;
    --accent:#f0a04b; --accent-ink:#1a1714; --accent-soft:#3d2d1b; --chip:#312c26;
    --ok:#7bc58a; --warn:#e8806b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:68px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:7px 12px 6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.wrap{max-width:780px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.title b{font-size:15px;white-space:nowrap}
.hdr-nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.active-sample-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:5px 10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px}
#hdrname{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.01em;line-height:1.2;word-break:break-word}
@media (max-width:640px){.brand-txt{display:none!important}}
.progress-track{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--ok);transition:width .25s ease}
.steps{display:flex;gap:5px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;min-width:40px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.step.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.step.done{color:var(--ink);border-color:var(--ok)}
.step .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.step.on .dot{background:var(--accent-ink)}
main{max-width:780px;margin:0 auto;padding:10px 12px}
h2.phase{margin:0 0 8px;font-size:18px;display:flex;align-items:baseline;justify-content:space-between}
h2.phase small{font-size:12px;font-weight:400;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.sub{font-size:12px;color:var(--muted);margin:8px 0 4px}
.sub:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--muted);margin:6px 0 3px}
label.f:first-child{margin-top:0}
label.f i{color:var(--warn);font-style:normal}
input[type=text],input[type=date],input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
textarea{min-height:54px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:36px;font:inherit;font-size:14px;cursor:pointer;text-align:left;line-height:1.15}
.chip small{display:block;color:var(--muted);font-size:11px;margin-top:1px;font-weight:400}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.on small{color:var(--accent-ink);opacity:.85}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:36px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.scale{display:grid;gap:3px}
.scale .btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.scale button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;min-height:38px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative;padding:0 4px}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button.fill{background:var(--accent-soft);border-color:var(--accent)}
.scale .lbl{font-size:12px;color:var(--muted);min-height:16px}
.scale .lbl b{color:var(--ink)}
.sapore{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.sapore:first-of-type{border-top:0;padding-top:0}
.sapore:last-of-type{padding-bottom:0}
.sapore b{font-size:14px}
.sapore.rate{grid-template-columns:1fr;gap:4px;padding:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.tag button{border:0;background:transparent;color:var(--ink);font-size:16px;line-height:1;cursor:pointer;min-width:24px;min-height:24px}
.crumb{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:2px 0;text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:38px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.sm{min-height:30px;padding:0 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--warn)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px;z-index:5}
nav.bottom .wrap{display:flex;gap:8px}
nav.bottom .btn{flex:1}
.sum dl{margin:0;display:grid;grid-template-columns:minmax(105px,30%) 1fr;gap:4px 10px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0}
.miss{background:#fdeae5;border:1px solid var(--warn);color:#7a2a1a;border-radius:8px;padding:9px 11px;margin-bottom:9px;font-size:13px}
.miss-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.miss-pill{border:1px solid var(--warn);background:rgba(255,255,255,.65);color:inherit;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.miss-pill:hover{background:var(--warn);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .miss-pill{background:rgba(0,0,0,.35)}}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.backup-banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:9px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.backup-banner b{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .miss{background:#3a1f19;color:#f0b3a5}}
.radar-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
.radar-svg{width:230px;height:230px;max-width:100%;overflow:visible}
.radar-legend{display:grid;gap:4px;font-size:13px;min-width:160px}
.radar-legend div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:2px}
.search-box{position:relative;margin-bottom:6px}
.search-results{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.notebtn{font-size:13px}
/* ---- Tablet / schermi touch grandi (iPad, 768px e oltre) ---- */
@media (min-width:768px){
  body{font-size:15px;padding-bottom:74px}
  header.top{padding:8px 20px 7px}
  .wrap{max-width:1200px}
  .title b{font-size:17px}
  #hdrname{font-size:19px}
  .steps{flex-wrap:wrap;overflow:visible;gap:6px}
  .step{flex:1 1 0;min-width:0;padding:7px 8px;font-size:13px;text-align:center;white-space:normal;line-height:1.15}
  main{max-width:1200px;padding:12px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  main>*{margin:0}
  main>h2.phase,main>.miss,main>.backup-banner,main>.row,main>.card.wide,main>.atlas-sticky{grid-column:1/-1}
  h2.phase{font-size:21px;margin:0}
  .card{padding:13px 15px;border-radius:12px}
  .card h3{font-size:12px;margin-bottom:8px}
  .chips{gap:6px}
  .chip{min-height:40px;font-size:14px;padding:7px 11px;border-radius:9px}
  .chip small{font-size:11px}
  .seg button{min-height:40px;padding:7px 14px;font-size:14px}
  .scale button{min-height:42px;font-size:15px;border-radius:9px}
  .scale .lbl{font-size:12px}
  input[type=text],input[type=date],input[type=search],textarea{min-height:40px;font-size:15px}
  .sapore{grid-template-columns:95px 1fr}
  .sapore b{font-size:15px}
  .sapore.rate{grid-template-columns:minmax(140px,34%) 1fr;align-items:center;gap:10px}
  .tag{font-size:14px;padding:4px 6px 4px 11px}
  .tag button{min-width:28px;min-height:28px}
  .btn{min-height:42px;font-size:15px}
  .btn.sm{min-height:32px;font-size:13px}
  nav.bottom{padding:9px 20px}
  .sum dl{font-size:15px}
}
@media (min-width:768px) and (max-width:1023px) and (orientation:portrait){
  main{grid-template-columns:1fr}
}
.cmp-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.cmp-table th,.cmp-table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cmp-table th{color:var(--muted);font-weight:600;width:28%}
select.sel-cmp{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.atlas-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.atlas-hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.atlas-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.atlas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;font-size:13px}
@media (max-width:520px){.atlas-grid{grid-template-columns:1fr}}
.atlas-item b{color:var(--muted);font-size:11px;display:block;text-transform:uppercase}
.atlas-match{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.tag-ok{display:inline-block;background:rgba(63,138,79,.15);color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag-diff{display:inline-block;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.cheese-photo-box{display:flex;flex-direction:column;gap:8px}
.cheese-photo-frame{position:relative;width:100%;height:175px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.cheese-photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
.cheese-photo-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;padding:18px 10px 7px;font-size:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.cheese-photo-cap b{font-size:13px}
.cheese-photo-cap a{color:#ffd29d;text-decoration:underline;font-size:11px;white-space:nowrap}
.onaf-brand{display:inline-flex;align-items:center;gap:10px;flex-shrink:0}
.onaf-logo{height:38px;width:auto;display:block}
.print-hdr{display:none}
@media (min-width:768px){.onaf-logo{height:44px}}
.italy-wrap{display:grid;grid-template-columns:minmax(360px,530px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.italy-wrap{grid-template-columns:1fr}}
.italy-map-box{background:linear-gradient(180deg,#eef5fa 0%,#e3eef6 100%);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .italy-map-box{background:linear-gradient(180deg,#1d262e 0%,#172027 100%)}}
.italy-svg{width:100%;max-width:510px;height:auto;margin:0 auto;display:block;}
.reg-poly{stroke:#ffffff;stroke-width:1.25;stroke-linejoin:round;cursor:pointer;transition:opacity .15s,fill .2s,stroke-width .15s}
.reg-poly:hover{opacity:.86;stroke:#2b2622;stroke-width:2}
.reg-poly.sel{stroke:#2b2622;stroke-width:2.4}
.reg-poly.loc{fill:#2d7a47!important;stroke:#ffffff;stroke-width:2.2}
.loc-banner{background:rgba(63,138,79,.13);border:1px solid var(--ok);border-radius:10px;padding:8px 11px;margin-bottom:10px;font-size:13px}
.reg-lbl{font-family:system-ui,-apple-system,sans-serif;font-size:8.2px;font-weight:800;fill:#1f1b18;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.2px;stroke-linejoin:round}
.reg-cnt{font-family:system-ui,-apple-system,sans-serif;font-size:8.8px;font-weight:800;fill:#8a3b00;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:2.4px;stroke-linejoin:round}
.reg-badge{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.reg-badge.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ric-pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin-right:6px;text-transform:uppercase}
.ric-DOP{background:#fde6c4;color:#8a4500;border:1px solid #d9791a}
.ric-IGP{background:#dceefb;color:#145388;border:1px solid #3b82f6}
.ric-STG{background:#e2f4e5;color:#1e632b;border:1px solid #3f8a4f}
.ric-PAT{background:#f1e8f9;color:#5b2b82;border:1px solid #8b5cf6}
.cheese-dir-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.cheese-dir-item:first-child{border-top:0;padding-top:0}
.map-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:center;flex-wrap:wrap}
.map-swatch{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.marchio-slot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.marchio-img{height:144px;max-width:330px;object-fit:contain;border-radius:8px;background:#fff;padding:6px;border:1px solid var(--line);display:block}
.marchio-seal{height:138px;min-width:138px;padding:0 14px;border-radius:12px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:.04em;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);text-align:center;line-height:1.15}
.marchio-seal span{font-size:13px!important;margin-top:2px}
.marchio-info{flex:1;min-width:0}
.marchio-info b{display:block;font-size:13px;color:var(--ink)}
.marchio-info small{display:block;font-size:11px;color:var(--muted)}
.gloss-term{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative;transition:background .15s,color .15s;border-radius:3px;padding:0 1px}
.gloss-term:hover{background:var(--accent-soft);color:var(--accent)}
.chip .gloss-term{border-bottom:1.5px dotted currentColor}
.chip.on .gloss-term:hover{background:rgba(255,255,255,.22);color:inherit}
button .gloss-term,a .gloss-term{border-bottom:0!important;cursor:inherit;padding:0}
button .gloss-term:hover,a .gloss-term:hover{background:none;color:inherit}
.gloss-i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:6px;border:1.5px solid currentColor;border-radius:50%;font-size:12px;font-weight:700;font-style:italic;font-family:Georgia,'Times New Roman',serif;line-height:1;opacity:.6;cursor:help;vertical-align:middle;flex-shrink:0}
.gloss-i:hover{opacity:1;background:var(--accent-soft);color:var(--accent)}
.chip.on .gloss-i:hover{background:rgba(255,255,255,.25);color:inherit}
.gloss-modal-bg{position:fixed;inset:0;background:rgba(20,16,12,.52);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
.gloss-modal{background:var(--card);color:var(--ink);border:1.5px solid var(--accent);border-radius:14px;max-width:520px;width:100%;padding:16px 18px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.gloss-modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.gloss-modal-hdr h4{margin:0;font-size:18px;color:var(--accent);line-height:1.2}
.gloss-area-pill{display:inline-block;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.gloss-item{padding:10px 0;border-top:1px solid var(--line)}
.gloss-item:first-child{border-top:0;padding-top:0}
.gloss-item:last-child{padding-bottom:0}
.gloss-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.gloss-item-head b{font-size:16px;color:var(--ink)}
.gloss-alpha{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.gloss-alpha button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;min-width:28px;height:28px;font-size:12px;font-weight:700;cursor:pointer;padding:0 5px}
.gloss-alpha button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media print{
  /* La stampa usa sempre la tavolozza chiara, anche da dispositivo in tema scuro */
  :root,:root:not([data-theme="light"]){
    --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#555555; --line:#bbbbbb;
    --accent:#b85f0c; --accent-ink:#ffffff; --accent-soft:#fbe9d4;
    --ok:#2f6f3d; --warn:#b3402a; --chip:#f3f3f3;
  }
  .gloss-i{display:none!important}
  .gloss-term{border-bottom:0!important}
  .gloss-modal-bg{display:none!important}

  .print-hdr{display:flex!important;align-items:center;justify-content:space-between;grid-column:1/-1;border-bottom:2px solid #d9791a;padding-bottom:8px;margin-bottom:6px}
  .print-hdr .onaf-logo{height:46px}
  header.top,nav.bottom,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;max-width:100%}
  .card{break-inside:avoid;border-color:#bbb;padding:8px 10px;margin:0}

,"voci":[{"c":"pellette_di_vitello","l":"Pellette di vitello"}]},{"c":"letame","l":"Letame","voci":[{"c":"letame_bovino","l":"Letame bovino"}]}]},{"c":"speziato","l":"Speziato","sub":[{"c":"speziato_riscaldante","l":"Speziato riscaldante","voci":[{"c":"pepe","l":"Pepe"}]},{"c":"speziato_rinfrescante","l":"Speziato rinfrescante","voci":[{"c":"menta","l":"Menta"}]},{"c":"spezie","l":"Spezie","voci":[{"c":"noce_moscata","l":"Noce moscata"},{"c":"chiodi_di_garofano","l":"Chiodi di garofano"}]}]},{"c":"altro","l":"Altro","sub":[{"c":"altro","l":"Altro","voci":[{"c":"lievito","l":"Lievito"},{"c":"acido_propionico","l":"Acido propionico"},{"c":"acido_butirrico","l":"Acido butirrico"},{"c":"alcol_etilico","l":"Alcol etilico"},{"c":"rancido","l":"Rancido"},{"c":"salame","l":"Salame"},{"c":"pesce_sotto_sale","l":"Pesce sotto sale"},{"c":"ammoniaca_o_ammoniacale","l":"Ammoniaca o ammoniacale"},{"c":"acido_acetico_o_aceto","l":"Acido acetico o aceto"},{"c":"agro","l":"Agro"},{"c":"sulfureo","l":"Sulfureo"},{"c":"sapone","l":"Sapone"},{"c":"ammuffito","l":"Ammuffito"},{"c":"putrido","l":"Putrido"},{"c":"gomma","l":"Gomma"},{"c":"insilato","l":"Insilato"}]}]}]}</script>
<script type="application/json" id="d-glossario">{"schema":1,"aree":[{"id":"all","label":"Tutte le aree"},{"id":"0","label":"Area 0 · Tecnologia & Biochimica"},{"id":"1","label":"Area 1 · Aspetto esterno"},{"id":"2","label":"Area 2 · Aspetto interno"},{"id":"3","label":"Area 3 · Esame olfattivo"},{"id":"4","label":"Area 4 · Gusto, Aroma & Struttura"},{"id":"5","label":"Area 5 · Sensazioni finali"}],"termini":[{"term":"Affinamento","area":"0","aliases":["Affinato"],"def":"Fase successiva alla stagionatura in cui il formaggio viene posto in ambienti particolari (grotte, fosse, barrique) o a contatto con sostanze specifiche (vinacce, fieno, foglie, spezie) per sviluppare caratteri aromatici e strutturali distintivi."},{"term":"Caglio (Presame)","area":"0","aliases":["Caglio","Presame"],"def":"Preparato enzimatico (di origine animale, vegetale o microbica) contenente chimosina e pepsina, in grado di scindere la κ-caseina e provocare la coagulazione presamica del latte."},{"term":"Coagulazione acida","area":"0","aliases":["Acida","Coagulazione lattica"],"def":"Processo in cui la precipitazione delle caseine avviene per acidificazione (naturale da fermenti lattici o per aggiunta di acidi organici) al raggiungimento del punto isoelettrico (pH ≈ 4,6), generando cagliate demineralizzate, friabili e poco elastiche."},{"term":"Coagulazione presamica","area":"0","aliases":["Presamica"],"def":"Processo enzimatico in cui il caglio aggrega le micelle di caseina formando un reticolo tridimensionale elastico, compatto e ricco di calcio."},{"term":"Enzima","area":"0","aliases":["Enzimi","Enzimatica","Enzimatico"],"def":"Catalizzatore biologico di natura proteica che accelera specifiche reazioni biochimiche senza consumarsi nel processo. Nel settore lattiero-caseario gli enzimi (endogeni del latte come la plasmina, apportati dal caglio come la chimosina, o prodotti dai microrganismi come proteasi e lipasi) guidano sia la coagulazione sia la maturazione della cagliata, scindendo proteine e grassi in composti più semplici."},{"term":"Forza del caglio (Titolo)","area":"0","aliases":["Forza del caglio","Titolo del caglio"],"def":"Misura dell’attività coagulante di un caglio, espressa convenzionalmente come il numero di parti (o millilitri) di latte crudo intero che 1 parte (o 1 ml / 1 g) di caglio è in grado di coagulare in 40 minuti alla temperatura di 35 °C (metodo internazionale Soxhlet / IDF). Ad esempio, un caglio con titolo 1:10.000 coagula 10 litri di latte con 1 ml di prodotto."},{"term":"Metabolita","area":"0","aliases":["Metaboliti"],"def":"Sostanza organica prodotta o trasformata durante il metabolismo microbico ed enzimatico nel corso della fermentazione e della stagionatura del formaggio. I metaboliti principali (acido lattico, acido propionico, diacetile, acetaldeide, amminoacidi liberi, acidi grassi a catena corta, esteri e chetoni) sono i diretti responsabili del profilo aromatico, gustativo e strutturale del prodotto finito."},{"term":"Pasta cotta / semicotta / cruda","area":"0","aliases":["Pasta cotta","Pasta semicotta","Pasta cruda"],"def":"Classificazione basata sulla temperatura raggiunta dalla cagliata durante la lavorazione: nessuna cottura oltre quella di coagulazione (cruda, ≤ 38 °C), riscaldamento moderato (semicotta, 38–48 °C) o cottura spinta (cotta, > 48 °C)."},{"term":"Pasta filata","area":"0","aliases":["Filata"],"def":"Tecnologia che prevede la filatura della cagliata matura (a pH ≈ 5,1–5,3) in acqua bollente (80–90 °C), conferendo alla pasta una struttura fibrosa a sfoglie sovrapposte."},{"term":"Precursore (aromatico o gustativo)","area":"0","aliases":["Precursore","Precursori"],"def":"Molecola di partenza, di per sé spesso inodore o insapore presente nel latte o nella cagliata (come caseine, trigliceridi, lattosio o acido citrico), che attraverso reazioni enzimatiche e microbiche (proteolisi, lipolisi, glicolisi) viene degradata dando origine a metaboliti sensorialmente attivi (odori, aromi e sapori caratteristici)."},{"term":"Agatura (con agatura)","area":"1","aliases":["Agatura","Con agatura","Foratura","Forinatura"],"def":"Presenza sulla superficie della forma dei segni e dei piccoli fori lasciati dalla foratura (o forinatura) meccanica con lunghi aghi d’acciaio, praticata nei formaggi erborinati inoculati (es. Gorgonzola, Roquefort, Stilton) per favorire la penetrazione dell’ossigeno nella massa caseosa e consentire lo sviluppo delle muffe nobili (Penicillium roqueforti). Non si applica invece agli erborinati naturali/spontanei come il Castelmagno DOP, nei quali la foratura è vietata dal disciplinare e l’erborinatura nasce esclusivamente dall’ossigeno rimasto negli interstizi della cagliata frantumata e pressata."},{"term":"Buccia","area":"1","aliases":[],"def":"Strato esterno sottile, tenero e moderatamente consistente, tipico di formaggi a breve stagionatura o a crosta fiorita (es. Robiola di Roccaverano DOP)."},{"term":"Canestrata","area":"1","aliases":["Canestrato"],"def":"Superficie che reca l’impronta intrecciata del canestro (fuscella o giunco) utilizzato per lo spurgo e la formatura della cagliata."},{"term":"Cappata (trattata)","area":"1","aliases":["Cappata","Trattata (cappata)"],"def":"Crosta sottoposta a trattamenti protettivi superficiali (oliatura, ceratura, affumicatura, morchia d’olio, cenere o terra) per regolare la traspirazione e proteggere la forma."},{"term":"Crosta","area":"1","aliases":[],"def":"Strato esterno consistente, da moderatamente duro a duro, formatosi per disidratazione superficiale, salatura e attività microbica durante la stagionatura."},{"term":"Crosta fiorita","area":"1","aliases":["Fiorita"],"def":"Superficie ricoperta da una muffa bianca, feltrosa e vellutata (prevalentemente Penicillium camemberti o Geotrichum candidum)."},{"term":"Crosta lavata","area":"1","aliases":["Lavata"],"def":"Superficie sottoposta a spugnature periodiche con salamoia, acqua, birra o distillati; favorisce lo sviluppo di batteri alofili (es. Brevibacterium linens) che donano colore aranciato/rossiccio e odori intensi."},{"term":"Essudata (umida)","area":"1","aliases":["Essudata","Umida (essudata)"],"def":"Superficie che presenta goccioline di liquido (siero o grasso fuso per sineresi o sbalzi termici)."},{"term":"Facce","area":"1","aliases":["Faccia"],"def":"Le due superfici piane, concave o convesse (bombate) che delimitano superiormente e inferiormente la forma."},{"term":"Morchia (con morchia)","area":"1","aliases":["Morchia","Con morchia"],"def":"Patina untuosa, brunastra e densa che si forma sulla crosta per l’azione combinata di microrganismi, essudati e trattamenti oleosi."},{"term":"Pelle","area":"1","aliases":[],"def":"Sottilissima pellicola elastica e lucida che avvolge i formaggi freschi a pasta filata (es. Mozzarella), priva di vera crosta."},{"term":"Scalzo","area":"1","aliases":[],"def":"La fascia laterale (perimetrale) della forma compresa tra le due facce; può essere diritto, concavo, convesso (bombato) o obliquo."},{"term":"Colatura","area":"2","aliases":["Colatura (rammollimento)"],"def":"Rammollimento e fluidificazione della pasta (spesso nel sottocrosta) dovuti a un’intensa proteolisi enzimatica indotta dalle muffe superficiali."},{"term":"Discontinuità (elementi di)","area":"2","aliases":["Discontinuità","Elementi di discontinuità","Sfogliatura","Sfoglia"],"def":"Interruzioni nell’omogeneità della pasta non attribuibili all’occhiatura, quali sfogliatura (separazione in lamelle), distacco/strappo, gessosità o colatura."},{"term":"Erborinatura","area":"2","aliases":["Erborinato"],"def":"Sviluppo di muffe interne (prevalentemente Penicillium roqueforti) di colore verde, blu o grigio-verde, favorito dalla foratura delle forme e dalla presenza di ossigeno negli interstizi della pasta."},{"term":"Gessosità","area":"2","aliases":["Gessosa"],"def":"Aspetto opaco, bianco gesso e friabile della pasta, tipico delle cagliate a coagulazione acida o lattica fortemente demineralizzate."},{"term":"Occhiatura (alveoli)","area":"2","aliases":["Occhiatura","Alveoli","Occhiata"],"def":"Cavità rotondeggianti (occhi) o irregolari (occhiatura meccanica o da fermentazione) distribuite nella pasta, generate rispettivamente dalla produzione di CO₂ (fermentazione propionica/eterolattica) o dalla mancata saldatura dei granuli di cagliata."},{"term":"Occhio di pernice","area":"2","aliases":[],"def":"Occhiatura molto fine, regolare e rotonda (1–3 mm), spesso lucida all’interno, tipica dei formaggi semiduri a pasta semicotta (es. Bitto, Fontina, Formai de Mut)."},{"term":"Sottocrosta","area":"2","aliases":[],"def":"Zona periferica della pasta immediatamente adiacente alla crosta, che può apparire più scura, compatta o, al contrario, più cremosa per effetto della maturazione centripeta."},{"term":"Struttura della pasta (STRUTTURA)","area":"2","aliases":["Struttura della pasta","Struttura"],"def":"Organizzazione fisica della massa caseosa osservata al taglio e al tatto nell’esame visivo/tattile interno (voce 2.6 ONAF). Si articola in quattro sottogruppi: Contenuto d’acqua (Cremosa, Molle, Tenera, Semidura, Dura), Presenza di liquidi in superficie (Umida, Secca, Untuosa), Consistenza (Rigida, Elastica, Compatta, Deformabile, Friabile) e Morfologia della superficie di taglio (Granulosa, Sabbiosa/Farinosa/Gessosa, Rugosa, Liscia, Fibrosa)."},{"term":"Cremosa (STRUTTURA · Contenuto d’acqua)","area":"2","aliases":["Cremosa"],"def":"Pasta ad elevatissimo contenuto idrico e lipidico, priva di consistenza propria, fluida, spalmabile e vellutata al taglio e al tatto (es. Squacquerone di Romagna DOP, Crescenza, Mascarpone)."},{"term":"Molle (STRUTTURA · Contenuto d’acqua)","area":"2","aliases":["Molle","Pasta molle"],"def":"Pasta molto morbida e cedevole alla minima pressione digitale, ad alto contenuto d’acqua (generalmente > 45–50%), che mantiene appena la propria forma al taglio (es. Taleggio DOP, Gorgonzola Dolce DOP)."},{"term":"Tenera (STRUTTURA · Contenuto d’acqua)","area":"2","aliases":["Tenera"],"def":"Pasta morbida e docile al taglio, leggermente più asciutta e sostenuta rispetto alla pasta molle, tipica dei formaggi a breve stagionatura (es. Pecorino Toscano DOP fresco, Caciotta)."},{"term":"Semidura (STRUTTURA · Contenuto d’acqua)","area":"2","aliases":["Semidura","Pasta semidura"],"def":"Pasta di media consistenza e contenuto idrico intermedio (circa 36–45%), ben tagliabile a fette nette senza sbriciolarsi né deformarsi eccessivamente (es. Fontina DOP, Asiago Pressato DOP, Toma Piemontese DOP)."},{"term":"Dura (STRUTTURA · Contenuto d’acqua)","area":"2","aliases":["Dura","Pasta dura"],"def":"Pasta fortemente disidratata (umidità generalmente < 36%), molto resistente al taglio, tipica dei formaggi a medio-lunga o lunga stagionatura che spesso si aprono a scaglie (es. Parmigiano Reggiano DOP, Grana Padano DOP, Pecorino Romano DOP)."},{"term":"Umida (PRESENZA LIQUIDI SUPERFICIE)","area":"2","aliases":["Umida"],"def":"Superficie di taglio che presenta un velo acquoso o sieroso visibile e percepibile al tatto, dovuto all’elevata ritenzione di siero nella cagliata (es. Mozzarella di Bufala Campana DOP, Squacquerone)."},{"term":"Secca (PRESENZA LIQUIDI SUPERFICIE)","area":"2","aliases":["Secca"],"def":"Superficie di taglio asciutta, priva di trasudamento sia acquoso sia lipidico al tatto e alla vista, tipica di formaggi stagionati o magri."},{"term":"Untuosa (PRESENZA LIQUIDI SUPERFICIE)","area":"2","aliases":["Untuosa"],"def":"Superficie di taglio velata da una sottile pellicola lipidica (grasso fuso libero) che rende la pasta lucida e scorrevole al tatto, tipica di formaggi grassi o maturi serviti a temperatura ambiente."},{"term":"Rigida (CONSISTENZA)","area":"2","aliases":["Rigida"],"def":"Pasta che oppone forte resistenza alla flessione e alla compressione, spezzandosi o fratturandosi prima di piegarsi (es. formaggi stravecchi a pasta dura)."},{"term":"Elastica (CONSISTENZA)","area":"2","aliases":["Elastica","Elasticità"],"def":"Proprietà della pasta di deformarsi sotto una moderata pressione digitale o alla flessione della fetta, recuperando rapidamente e completamente la forma originaria al cessare della forza (es. Fontina DOP, Montasio fresco)."},{"term":"Compatta (CONSISTENZA)","area":"2","aliases":["Compatta"],"def":"Pasta densa, coesa e ben serrata, priva di vuoti, fessurazioni o cedimenti strutturali nella massa caseosa."},{"term":"Deformabile (CONSISTENZA)","area":"2","aliases":["Deformabile"],"def":"Pasta plastica e malleabile che cambia facilmente forma sotto la pressione dei denti o delle dita senza rompersi e senza ritornare alla posizione iniziale (comportamento plastico, opposto all’elastico)."},{"term":"Friabile (CONSISTENZA)","area":"2","aliases":["Friabile"],"def":"Pasta poco coesa che tende a sbriciolarsi, fratturarsi o separarsi in scaglie e frammenti irregolari al taglio o alla pressione (es. Castelmagno DOP, Parmigiano Reggiano DOP stagionato)."},{"term":"Granulosa (MORFOLOGIA)","area":"2","aliases":["Granulosa"],"def":"Superficie di taglio irregolare caratterizzata dalla presenza visibile e tattile di granuli di cagliata distinti, compatti e ben saldati tra loro (es. Grana Padano DOP, Parmigiano Reggiano DOP)."},{"term":"Sabbiosa / Farinosa / Gessosa (MORFOLOGIA)","area":"2","aliases":["Sabbiosa/Farinosa/Gessosa","Sabbiosa","Farinosa","Gessosa"],"def":"Superficie di taglio opaca e polverulenta che richiama al tatto la sabbia finissima, la farina o il gesso (gessosa); tipica delle cagliate a coagulazione acida/lattica demineralizzate (es. caprini lattici, cuore del Quartirolo Lombardo DOP)."},{"term":"Rugosa (MORFOLOGIA)","area":"2","aliases":["Rugosa"],"def":"Superficie di taglio scabra, increspata e non levigata, che offre resistenza al polpastrello."},{"term":"Liscia (MORFOLOGIA)","area":"2","aliases":["Liscia"],"def":"Superficie di taglio perfettamente uniforme, continua, levigata e priva di asperità al tatto e alla vista (es. Crescenza, Fontina DOP)."},{"term":"Fibrosa (MORFOLOGIA)","area":"2","aliases":["Fibrosa"],"def":"Struttura costituita da fasci paralleli o lamelle allungate (sfoglie) che tendono a sfilacciarsi longitudinalmente, tipica dei formaggi a pasta filata (es. Mozzarella, Provolone, Caciocavallo)."},{"term":"Descrittore olfattivo","area":"3","aliases":["Descrittori olfattivi","Descrittore"],"def":"Termine specifico e codificato (es. burro fuso, fieno, nocciola, stalla) che identifica una nota odorosa riconducibile a un referente reale nell’Albero degli Odori e degli Aromi ONAF."},{"term":"Famiglia olfattiva","area":"3","aliases":["Famiglie","Famiglia"],"def":"Macro-categoria che raggruppa descrittori affini per origine chimica o naturalistica; nel sistema ONAF sono 8 (Lattico, Vegetale, Floreale, Fruttato, Tostato, Animale, Speziato, Altro)."},{"term":"Intensità olfattiva","area":"3","aliases":["Intensità"],"def":"Forza complessiva delle sensazioni odorose percepite per via ortonasale (diretta) annusando la superficie di taglio fresca, valutata su scala ONAF a 5 livelli (Bassa, Medio-bassa, Media, Medio-elevata, Elevata)."},{"term":"Odore (via ortonasale)","area":"3","aliases":["Odore","Odori"],"def":"Sensazione percepita dall’epitelio olfattivo quando le molecole volatili del formaggio vengono inspirate direttamente attraverso le narici prima della masticazione."},{"term":"Via diretta (ortonasale)","area":"3","aliases":["Via diretta","Ortonasale"],"def":"Percorso delle molecole volatili dall’ambiente esterno direttamente verso la mucosa olfattiva attraverso le cavità nasali."},{"term":"Adesività","area":"4","aliases":["Adesiva"],"def":"Parametro strutturale (valutato su scala di intensità) che misura lo sforzo richiesto alla lingua per staccare il formaggio dal palato e dai denti durante la masticazione."},{"term":"Aroma (via retronasale)","area":"4","aliases":["Aroma","Aromi","Via retronasale","Retronasale"],"def":"Insieme delle sensazioni olfattive percepite durante la masticazione, quando il calore corporeo (37 °C) e l’azione meccanica liberano composti volatili che risalgono dal cavo orale verso l’epitelio olfattivo attraverso la rinofaringe."},{"term":"Astringente","area":"4","aliases":["Astringenza"],"def":"Sensazione trigeminale di secchezza, rugosità e costrizione delle mucose orali (simile al caco acerbo o al carciofo), dovuta alla precipitazione delle proteine salivari."},{"term":"Cristalli (con cristalli)","area":"4","aliases":["Cristalli","Con cristalli","Tirosina"],"def":"Percezione tattile di granuli vetrosi, duri e croccanti nella pasta dei formaggi molto stagionati; sono costituiti principalmente da aggregati di tirosina (amminoacido poco solubile liberato dalla proteolisi) e lattato di calcio."},{"term":"Durezza","area":"4","aliases":["Dura"],"def":"Parametro strutturale (valutato su scala di intensità) che indica la resistenza opposta dal campione alla prima masticazione tra i molari."},{"term":"Friabilità","area":"4","aliases":["Friabile"],"def":"Parametro strutturale (valutato su scala di intensità) che esprime la tendenza del formaggio a rompersi e sbriciolarsi in numerosi frammenti fin dall’inizio della masticazione."},{"term":"Granulosa / Grumosa","area":"4","aliases":["Granulosa","Grumosa"],"def":"Percezione tattile in bocca rispettivamente di granuli compatti e ben definiti (es. Parmigiano Reggiano) oppure di piccole masse morbide e rapprese."},{"term":"Piccante","area":"4","aliases":["Piccantezza"],"def":"Sensazione trigeminale di pizzicore o calore pungente (simile a pepe o peperoncino), generata nei formaggi stagionati o erborinati dagli acidi grassi liberi a catena corta e media (butirrico, caproico, caprilico) liberati dalla lipolisi."},{"term":"Pungente","area":"4","aliases":[],"def":"Sensazione trigeminale irritante e acuta percepita sia in bocca sia nelle cavità nasali (es. ammoniaca, aceto, senape)."},{"term":"Sapore","area":"4","aliases":["Sapori"],"def":"Sensazione gustativa pura mediata dai recettori delle papille linguali su sostanze non volatili disciolte nella saliva; i 5 sapori fondamentali codificati ONAF sono Dolce, Acido, Salato, Amaro e Umami."},{"term":"Sensazioni trigeminali (chemestesi)","area":"4","aliases":["Sensazioni trigeminali","Trigeminali","Chemestesi"],"def":"Sensazioni tattili, termiche o dolorifiche (irritanti) mediate dalle terminazioni del nervo trigemino nella mucosa orale e nasale (Astringente, Piccante, Pungente, Rinfrescante, Bruciante, Metallico)."},{"term":"Solubilità","area":"4","aliases":["Solubile"],"def":"Parametro strutturale (valutato su scala di intensità) che indica la rapidità e la facilità con cui il campione si fonde e si scioglie nella saliva trasformandosi in un’emulsione fluida."},{"term":"Umami","area":"4","aliases":[],"def":"Quinto sapore fondamentale (dal giapponese saporito), evocato dall’acido glutammico libero (glutammato) e dai nucleotidi generati dalla proteolisi durante la stagionatura; conferisce pienezza, sapidità rotonda e persistenza gustativa."},{"term":"Umidità (in bocca)","area":"4","aliases":["Umidità"],"def":"Parametro strutturale che esprime la percezione di elevato contenuto di liquidi (acqua/siero) rilasciati dal formaggio durante la masticazione."},{"term":"Persistenza gusto-olfattiva (PGO)","area":"5","aliases":["Persistenza gusto-olfattiva","Persistenza","PGO"],"def":"Permanenza delle percezioni aromatiche e gustative (escluso il solo pizzicore trigeminale) dopo la deglutizione del boccone. Nel protocollo ONAF si misura in secondi su 5 livelli: Bassa (3 s), Medio-bassa (4–9 s), Media (10–15 s), Medio-elevata (16–29 s) ed Elevata (≥ 30 s)."},{"term":"Retrogusto","area":"5","aliases":[],"def":"Sensazione gustativa o aromatica residua che emerge dopo la deglutizione, talvolta distinta dal profilo percepito durante la masticazione (es. una nota leggermente amarognola o piccante finale)."},{"term":"Batteri (lattici e propionici)","area":"0","aliases":["Batteri","Batteri lattici","Fermenti lattici","Batteri propionici"],"def":"Microrganismi procarioti fondamentali nella caseificazione. I batteri lattici (LAB, es. Lactococcus, Lactobacillus, Streptococcus thermophilus) fermentano il lattosio in acido lattico guidando l’acidificazione e la proteolisi; i batteri propionici (es. Propionibacterium freudenreichii) trasformano i lattati in acido propionico, acido acetico e CO₂, responsabile dell’occhiatura tipica di formaggi come Emmental o Asiago."},{"term":"Batteri \"del rosso\" (corineformi)","area":"1","aliases":["Batteri del rosso","Brevibacterium linens","Corineformi"],"def":"Consorzio di batteri aerobi e alofili (tolleranti il sale), tra cui spicca Brevibacterium linens, che colonizzano la superficie dei formaggi a crosta lavata (es. Taleggio, Puzzone di Moena). Producono pigmenti carotenoidi dal colore aranciato-rossastro e composti solforati responsabili dei tipici odori intensi e penetranti."},{"term":"Cagliata","area":"0","aliases":[],"def":"Massa gelatinosa ottenuta dalla coagulazione del latte (presamica o acida) per aggregazione delle micelle di caseina, che ingloba al suo interno i globuli di grasso e il siero."},{"term":"Centripeta (maturazione)","area":"2","aliases":["Centripeta","Maturazione centripeta"],"def":"Andamento della maturazione che procede dall’esterno (crosta) verso il cuore della forma, tipico dei formaggi a crosta fiorita o lavata (es. Taleggio, Brie, Roccaverano stagionato): gli enzimi prodotti dalla microflora superficiale diffondono progressivamente verso l’interno, rendendo il sottocrosta più cremoso e fondente rispetto al centro."},{"term":"Filatura","area":"0","aliases":[],"def":"Operazione tecnologica tipica dei formaggi a pasta filata (Mozzarella, Provolone, Caciocavallo, Ragusano): la cagliata matura (pH 5,1–5,3, parzialmente demineralizzata) viene immersa in acqua calda (80–90 °C) e lavorata meccanicamente fino a ottenere una massa plastica, lucida ed elastica formata da fasci fibrosi sovrapposti."},{"term":"Grasso sulla sostanza secca (classificazione ONAF)","area":"0","aliases":["Grasso sul secco","Formaggio magro","Formaggio leggero","Formaggio grasso","Doppia crema","Semigrasso"],"def":"Percentuale di materia grassa riferita al peso del formaggio privato dell’acqua (sostanza secca). Nella tassonomia ONAF e merceologica i formaggi si distinguono in quattro classi: Magro (< 20% g/s.s., da latte scremato), Leggero o semigrasso (20–35% g/s.s., da latte parzialmente scremato), Grasso (> 35% e fino al 50% g/s.s., da latte intero) e Doppia crema (> 50% g/s.s., ottenuto con aggiunta di crema di latte)."},{"term":"Intero (latte)","area":"0","aliases":["Intero","Latte intero"],"def":"Latte che non ha subito alcuna sottrazione della frazione lipidica naturale (tenore in grasso generalmente ≥ 3,5% nel latte vaccino e ancora superiore in quello ovino e bufalino), conferendo alla pasta maggiore morbidezza, solubilità e rotondità aromatica."},{"term":"Lattasi (β-galattosidasi)","area":"0","aliases":["Lattasi"],"def":"Enzima idrolitico prodotto dai batteri lattici (e presente a livello intestinale) che scinde il lattosio nei due monosaccaridi semplici glucosio e galattosio, primo passaggio indispensabile della glicolisi fermentativa."},{"term":"Lieviti","area":"0","aliases":["Lievito"],"def":"Microrganismi eucarioti unicellulari (es. Debaryomyces hansenii, Kluyveromyces marxianus, Geotrichum candidum) che metabolizzano l’acido lattico deacidificando la superficie della cagliata nei primi giorni di stagionatura e preparando il substrato allo sviluppo dei batteri del rosso e delle muffe nobili."},{"term":"Lipasi","area":"0","aliases":[],"def":"Enzima (endogeno del latte crudo, presente nei cagli in pasta di agnello/capretto o prodotto da muffe e batteri) che idrolizza i trigliceridi liberando acidi grassi a catena corta e media (butirrico, caproico, caprilico), responsabili delle note piccanti e degli aromi intensi."},{"term":"Muffe (nobili o selezionate)","area":"1","aliases":["Muffe","Muffa","Ammuffita"],"def":"Funghi filamentosi pluricellulari che svolgono un ruolo determinante nella maturazione di specifiche tipologie casearie: muffe bianche superficiali (Penicillium camemberti) nei formaggi a crosta fiorita e muffe interne (Penicillium roqueforti) nei formaggi erborinati, dotate di elevatissima attività proteolitica e lipolitica."},{"term":"pH","area":"0","aliases":[],"def":"Indice logaritmico dell’acidità attiva (concentrazione di ioni idrogeno H⁺). Il latte fresco ha pH ≈ 6,6–6,7; durante la caseificazione l’acidificazione lattica abbassa il pH (fino a ~5,1–5,3 per la filatura o ~4,6 nella coagulazione acida), regolando l’attività del caglio, lo spurgo del siero e la demineralizzazione della pasta."},{"term":"Pressatura","area":"0","aliases":["Pressato"],"def":"Applicazione di una pressione meccanica sulla cagliata posta negli stampi (fascere) per favorire la fuoriuscita del siero residuo, compattare i granuli e conferire alla forma la geometria definitiva."},{"term":"Proteasi (e peptidasi)","area":"0","aliases":["Proteasi","Proteolisi"],"def":"Enzimi (provenienti dal caglio, dal latte crudo o dai microrganismi) che scindono le proteine (caseine) in peptidi e amminoacidi liberi (proteolisi), modificando la consistenza della pasta (da elastica a fondente o friabile) e generando sapori (umami, dolce, amaro) e precursori aromatici."},{"term":"Scremato / Parzialmente scremato (latte)","area":"0","aliases":["Scremato","Parz. scremato","Latte scremato"],"def":"Latte privato totalmente (scremato, grasso ≤ 0,5%) o parzialmente (parz. scremato, grasso 1,5–1,8%, spesso per affioramento naturale o centrifugazione) della crema di affioramento. Dà origine a formaggi dalla pasta più compatta, asciutta e adatta a lunghe stagionature (es. Grana Padano, Parmigiano Reggiano, Spressa)."},{"term":"Sentore","area":"3","aliases":["Sentori"],"def":"Percezione olfattiva o retronasale specifica e riconoscibile (anche tenue o sfumata) che evoca un determinato descrittore (es. sentore di fieno, di sottobosco, di burro fuso) durante l’esame del campione."},{"term":"Semistagionato","area":"0","aliases":[],"def":"Categoria merceologica e tecnologica che identifica i formaggi sottoposti a un periodo di maturazione intermedio (indicativamente compreso tra 1 e 3–6 mesi, in funzione della pezzatura, del tipo di latte e della tecnologia). Rappresenta un punto di equilibrio in cui crosta e profilo aromatico sono già ben sviluppati, mentre la pasta conserva ancora parte della morbidezza ed elasticità originarie."},{"term":"Sineresi","area":"0","aliases":[],"def":"Fenomeno chimico-fisico di contrazione del reticolo caseinico della cagliata che provoca l’espulsione attiva del siero intrappolato; è favorita dal taglio della cagliata, dall’aumento della temperatura (cottura) e dall’acidificazione."},{"term":"Spurgo (del siero)","area":"0","aliases":["Spurgo"],"def":"Drenaggio ed eliminazione del siero dalla cagliata durante le fasi di rottura, formatura, rivoltamento e pressatura; determina il residuo secco finale del formaggio e ne condiziona la conservabilità e la stagionatura."},{"term":"Stufatura","area":"0","aliases":[],"def":"Sosta delle forme appena formate in ambienti caldi e umidi (generalmente a 20–35 °C con elevata umidità relativa per alcune ore) subito dopo la formatura, finalizzata ad attivare rapidamente i fermenti lattici, completare lo spurgo del siero e favorire la chiusura della crosta."}]}</script>
<script type="application/json" id="d-abbinamenti">{"schema":1,"territorio":{"Valle d'Aosta":"Pane nero di segale valdostano, miele di rododendro o millefiori d’alta montagna, pere Martin Sec, polenta concia.","Piemonte":"Grissini stirati torinesi, pane di Langa, cugnà (mostarda d’uva), miele di tarassaco o castagno, nocciole Tonda Gentile delle Langhe.","Liguria":"Focaccia genovese poco salata, miele di erica o castagno ligure, olive taggiasche, noci e pinoli.","Lombardia":"Pane di segale o di mais (giallo), mostarda di Cremona o di Voghera, miele di tiglio o melata di bosco, polenta taragna.","Trentino-Alto Adige":"Pane di segale al cumino (Schüttelbrot / Vinschger), miele di rododendro o abete, mele renette, composte di mirtilli rossi.","Veneto":"Polenta bianca o gialla abbrustolita, radicchio rosso di Treviso tardivo, mostarda veneta, pane biscotto.","Friuli-Venezia Giulia":"Polenta di mais antico, miele di acacia del Carso, mele e pere, noci e cipolla rossa di Cavasso.","Emilia-Romagna":"Gnocco fritto o tigelle, Aceto Balsamico Tradizionale di Modena/Reggio Emilia, pere abate, fichi caramellati, piadina romagnola.","Toscana":"Pane sciocco toscano (senza sale), miele di corbezzolo o castagno della Lunigiana, fichi freschi, pere, fave fresche.","Umbria":"Torta al testo o pane sciapo umbro, miele di sulla o millefiori, tartufo nero estivo, noci.","Marche":"Crescia sfogliata di Urbino, sapa di mosto cotto, miele di girasole o acacia, fichi e pere.","Lazio":"Pane casareccio di Genzano o Lariano, fave fresche, pere, miele millefiori dell’Agro Pontino, puntarelle.","Abruzzo":"Pane casereccio abruzzese, miele di sulla o santoreggia, confettura d’uva Montepulciano (scrucchiata).","Molise":"Pane cafone molisano, miele di sulla, tartufo bianco o nero del Molise, noci e fichi secchi.","Campania":"Pane cafone cotto a legna, pomodorini del Piennolo o San Marzano, miele di acacia o castagno del Partenio, noci di Sorrento.","Puglia":"Taralli pugliesi all’olio EVO, pane di Altamura DOP, fichi freschi o mandorle di Toritto, miele di timo.","Basilicata":"Pane di Matera IGP, peperoni cruschi di Senise, miele di castagno del Vulture, fichi secchi.","Calabria":"Pane di Cerchiara o pitta calabrese, cipolla rossa di Tropea caramellata, fichi dottati di Cosenza, miele di fichi o agrumi.","Sicilia":"Pane nero di Castelvetrano, miele di zagara, timo o sulla degli Iblei, fichi d’India, mandorle di Avola.","Sardegna":"Pane carasau o pistoccu croccante, miele amaro di corbezzolo o cardo sardo, sapa di vino, fichi d’India."},"iconici":[{"id":218,"nome":"Parmigiano Reggiano","principio":"Concordanza umami e contrasto dolce-acido alla sapidità e friabilità dei cristalli di tirosina.","pane":"Pane neutro croccante o gnocco fritto caldo (per stagionature giovani 12–18 mesi).","dolce":"Gocce di Aceto Balsamico Tradizionale DOP (invecchiato ≥ 25 anni), miele millefiori delicato o mostarda di pere.","frutta":"Pere abate o Kaiser, fichi freschi, gherigli di noce.","verdure":"Sedano bianco croccante in pinzimonio, radicchio tardivo, scaglie su carpacci o risotti.","vino":"Lambrusco Grasparossa secco (giovane) o Franciacorta Satèn / Passito strutturato (oltre 30 mesi).","birra":"Belgian Dubbel o Strong Ale ambrata (note di caramello e frutta secca) o Barley Wine (per stravecchi > 36 mesi)."},{"id":208,"nome":"Grana Padano","principio":"Equilibrio tra sapidità, tendenza dolce e granulosità.","pane":"Pane di campagna a lievitazione naturale, grissini stirati.","dolce":"Mostarda mantovana di mele campanine, miele di acacia o tiglio.","frutta":"Uva bianca, pere abate, gherigli di noce.","verdure":"Sedano bianco croccante, carciofi crudi a lamelle, asparagi.","vino":"Lugana DOC, Franciacorta Brut o Rosso Conero (per lo stravecchio).","birra":"Belgian Blond Ale o Märzen / Festbier (maltata ed equilibrata)."},{"id":207,"nome":"Gorgonzola","principio":"Contrasto avvolgente alla piccantezza e sapidità delle muffe (Penicillium roqueforti).","pane":"Pan brioche, pane alle noci e uvetta, polenta calda abbrustolita.","dolce":"Miele di acacia o melata, confettura di fichi o cipolle rosse, cioccolato fondente 75% (con il Piccante).","frutta":"Pere Williams o abate, fichi freschi, gherigli di noce.","verdure":"Sedano croccante, indivia belga, zucca al forno o gnocchi.","vino":"Moscato d’Asti DOCG (Dolce), Passito di Pantelleria o Barolo Chinato (Piccante).","birra":"Imperial Stout / Baltic Porter (tostato e cioccolato per il Piccante) o Belgian Tripel / Dubbel (per il Dolce)."},{"id":197,"nome":"Castelmagno","principio":"Sostegno aromatico alla pasta friabile, gessosa e naturalmente erborinata.","pane":"Pane di segale o pane casereccio tostato.","dolce":"Miele di tarassaco o millefiori d’alta montagna, cugnà piemontese.","frutta":"Noci, pere madernassa, uva nera.","verdure":"Gnocchi di patate della Val Grana, porri stufati, cardi.","vino":"Barolo DOCG o Barbaresco DOCG strutturati ed evoluti.","birra":"Belgian Dark Strong Ale (Quadrupel) o Barley Wine complesso e avvolgente."},{"id":253,"nome":"Taleggio","principio":"Pulizia dell’untuosità e della fondente proteolisi della crosta lavata.","pane":"Pane di segale, pane ai cereali.","dolce":"Composta di cipolle rosse, mostarda di Cremona o confettura di mele cotogne.","frutta":"Pere, noci, uva rosata.","verdure":"Radicchio rosso tardivo alla griglia, polenta taragna, patate lesse.","vino":"Valtellina Superiore DOCG o Franciacorta Rosé.","birra":"Saison / Farmhouse Ale (secca e pepata, sgrassa il palato) o Bière de Garde ambrata."},{"id":203,"nome":"Fontina","principio":"Concordanza dolce-burrosa e vegetale di alpeggio.","pane":"Pane nero valdostano di segale e frumento.","dolce":"Miele di rododendro o millefiori di montagna.","frutta":"Mele renette, pere Martin Sec, noci.","verdure":"Patate lesse di montagna, polenta concia, funghi trifolati.","vino":"Torrette Valle d’Aosta DOC o Pinot Nero dell’Alto Adige.","birra":"Bock / Doppelbock (note di crosta di pane e malto tostato) o Vienna Lager."},{"id":236,"nome":"Puzzone di Moena / Spretz Tzaorì","principio":"Contrasto acido-vegetale all’intensa aromaticità solforata della crosta lavata.","pane":"Pane di segale al cumino (Schüttelbrot).","dolce":"Composta di mirtilli rossi o cipolle caramellate, miele di melata.","frutta":"Mele Golden, pere, noci.","verdure":"Patate lesse calde, polenta di Storo, crauti stufati.","vino":"Teroldego Rotaliano DOC o Gewürztraminer secco.","birra":"Rauchbier (affumicata) o Saison rustica ad alta carbonazione."},{"id":224,"nome":"Pecorino Romano","principio":"Attenuazione dell’elevata sapidità e piccantezza lipolitica tramite dolcezza fresca.","pane":"Pane sciapo (senza sale) o pane carasau.","dolce":"Miele di castagno o di cardo, confettura di fichi.","frutta":"Pere, fichi freschi, mandorle.","verdure":"Fave fresche crudo, carciofi romaneschi, puntarelle.","vino":"Cannonau di Sardegna DOC o Cesanese del Piglio DOCG.","birra":"Scotch Ale / Wee Heavy (dolcezza maltata) o Doppelbock."},{"id":202,"nome":"Fiore Sardo","principio":"Armonia con le note affumicate, animali e piccanti della pasta dura.","pane":"Pane carasau o pistoccu croccante.","dolce":"Miele amaro di corbezzolo, sapa di mosto cotto.","frutta":"Fichi d’India, mandorle tostate.","verdure":"Sedano croccante, carciofi spinosi sardi crudi, fave.","vino":"Carignano del Sulcis Riserva DOC o Cannonau Riserva.","birra":"Rauchbier (richiamo all’affumicatura) o Porter / Brown Ale."},{"id":214,"nome":"Mozzarella di Bufala Campana","principio":"Esaltazione della succosità lattica e della leggera acidità fresca.","pane":"Pane cafone campano o focaccia neutra poco unta.","dolce":"Nessun dolce (evitare mieli che coprono il latte fresco); un filo di olio EVO fruttato leggero.","frutta":"Fichi fioroni (in abbinamento estivo), melone bianco.","verdure":"Pomodorini del Piennolo, basilico fresco, zucchine grigliate.","vino":"Asprinio di Aversa DOC o Falanghina dei Campi Flegrei DOC.","birra":"Blanche / Witbier (fresca e agrumata) o Pilsner / Kellerbier."},{"id":269,"nome":"Burrata di Andria","principio":"Contrasto croccante e acidulo alla ricchezza lipidica della stracciatella e panna.","pane":"Pane di Altamura DOP tostato o taralli pugliesi.","dolce":"Pomodorini confit o composta leggera di fichi.","frutta":"Fichi freschi, mandorle di Toritto.","verdure":"Pomodori ramati, rucola selvatica, olio EVO Coratina.","vino":"Castel del Monte Bianco DOC o Metodo Classico Brut.","birra":"Berliner Weisse / Gose (acidità lattica che sgrassa) o Saison chiara."},{"id":243,"nome":"Roccaverano","principio":"Accompagnamento delicato alla nota caprina e lattico-acida.","pane":"Grissini stirati, pane bianco casereccio.","dolce":"Miele di acacia o di tiglio, composta di albicocche.","frutta":"Nocciole Piemonte IGP, pere, fragole.","verdure":"Insalatina di valeriana, asparagi bianchi, zucchine.","vino":"Alta Langa DOCG Brut o Moscato d’Asti (con versioni affinate).","birra":"Blanche / Weizen (note acidule e speziate) o Gueuze / Lambic giovane (per versioni affinate)."},{"id":249,"nome":"Squacquerone di Romagna","principio":"Sostegno caldo e croccante alla cremosità madreperlacea e acidula.","pane":"Piadina romagnola calda sfogliata.","dolce":"Fichi caramellati alla romagnola.","frutta":"Fichi freschi, uva bianca.","verdure":"Rucola selvatica fresca, radicchio di campo.","vino":"Albana di Romagna Secco DOCG o Sangiovese di Romagna giovane.","birra":"Kellerbier / Helles (morbida e maltata) o Blanche."},{"id":205,"nome":"Formaggio di Fossa di Sogliano","principio":"Bilanciamento della complessità fermentativa di sottobosco, tartufo e piccantezza.","pane":"Piadina sfogliata o pane casereccio tostato.","dolce":"Sapa romagnola, miele di castagno, fichi caramellati.","frutta":"Pere, noci, uva nera.","verdure":"Passatelli in brodo, tagliatelle o risotti mantecati.","vino":"Sangiovese Superiore Riserva o Albana Passito.","birra":"Belgian Dubbel / Quadrupel o Old Ale."}]}</script>

<script>
/* ---------- Dati: caricati dai blocchi JSON incorporati (cartella dati/) ---------- */
const INT5=['Bassa','Medio-bassa','Media','Medio-elevata','Elevata'];
const ABBR={'Non percettibile':'NP','Bassa':'B','Medio-bassa':'MB','Media':'M','Medio-elevata':'ME','Elevata':'E'};
const DATA=k=>JSON.parse(document.getElementById('d-'+k).textContent);
const VOC=DATA('vocabolari');
const _lab=list=>list.map(x=>x.l);
const _grp=gs=>Object.fromEntries(gs.map(g=>[g.l,_lab(g.voci)]));
// Strutture di lavoro (etichette) ricostruite dai vocabolari codificati
const L={};
for(const [k,v] of Object.entries(VOC.liste)) L[k]=_lab(v);
for(const k of ['aspetto','occhiatura','erbor','strpasta']) L[k]=_grp(VOC.gruppi[k]);
L.persHint=VOC.liste.pers.map(x=>x.hint);
const TREE=Object.fromEntries(VOC.descrittori.map(f=>[f.l,Object.fromEntries(f.sub.map(s=>[s.l,_lab(s.voci)]))]));
const CAT=_grp(VOC.gruppi.categoria);
const PRES=_grp(VOC.gruppi.presentazione);
const PAIRING_CHIPS=_grp(VOC.gruppi.abbinamenti);

const _GL=DATA('glossario');
const GLOSSARY_AREAS=_GL.aree;
const ONAF_GLOSSARY=_GL.termini.map(t=>({...t,areaName:(_GL.aree.find(a=>a.id===t.area)||{}).label||''}));

const _AB=DATA('abbinamenti');
const TERRITORY_PAIRINGS=_AB.territorio;
const ICONIC_BY_ID=new Map(_AB.iconici.map(x=>[x.id,x]));

const ITALY_REGIONS=DATA('mappa-italia').regioni;

// Atlante: la chiave è l'ID ONAF (i nomi non sono univoci). La tassonomia è salvata per codice.
const _decTax=(k,arr)=>{
  const voci=k==='crosta'?VOC.liste.crosta_atlante:(VOC.gruppi.categoria.find(g=>g.c===k)||{voci:[]}).voci;
  return arr.map(c=>{const f=voci.find(x=>x.c===c);return f?f.l:c;});
};
const ONAF_ATLAS=DATA('atlante').formaggi.map(a=>{
  const tax={};
  for(const [k,v] of Object.entries(a.tax||{})) tax[k]=_decTax(k,v);
  const o={onafId:a.id,nome:a.nome,regioni:a.regioni,ric:a.ric,regione:a.regioni.join(' / '),latte:`Scheda ufficiale Atlante ONAF (ID ${a.id})`,tax,fonte:a.fonte||{}};
  if(a.profilo){const p=a.profilo;Object.assign(o,p,{persIdx:p.persistenza-1,persistenza:L.pers[p.persistenza-1],detailed:true});}
  return o;
});
const ATLAS_BY_ID=new Map(ONAF_ATLAS.map(a=>[a.onafId,a]));
const atlasById=id=>ATLAS_BY_ID.get(Number(id))||null;

// Indice piatto per la ricerca rapida nei descrittori
const FLAT_TREE=[];
for(const [f,subs] of Object.entries(TREE)){
  for(const [s,recs] of Object.entries(subs)){
    if(recs.length===0){
      FLAT_TREE.push({f,s,r:'',label:`${f} › ${s}`,search:`${f} ${s}`.toLowerCase()});
    }else{
      FLAT_TREE.push({f,s,r:'',label:`${f} › ${s} (generico)`,search:`${f} ${s}`.toLowerCase()});
      for(const r of recs){
        FLAT_TREE.push({f,s,r,label:`${r}`,sub:`${f} › ${s}`,search:`${r} ${s} ${f}`.toLowerCase()});
      }
    }
  }
}

/* ---------- Stato ---------- */
const KEY='scheda-degustazione-prototipo-v1';
const KEY2='scheda-degustazione-prototipo-v2';
const KEY3='scheda-degustazione-v3';
const SCHEMA=3;
const APP_ID='scheda-degustazione-formaggi';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const newId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fresh=()=>({step:0,v:{data:today()},created:Date.now()});

/* ---------- Codifica di archiviazione (schema 3) ----------
   In memoria la scheda lavora con le etichette; su disco (localStorage, backup, export)
   si salvano codici stabili, così correggere una dicitura non rompe lo storico.
   Scala unica delle intensità: 0 = non percettibile, 1–5 = da bassa a elevata. */
const _mk=items=>({enc:new Map(items.map(x=>[x.l,x.c])),dec:new Map(items.map(x=>[x.c,x.l]))});
const VM={};
for(const [k,v] of Object.entries(VOC.liste)) VM[k]=_mk(v);
for(const [k,v] of Object.entries(VOC.gruppi)) if(k!=='categoria'&&k!=='presentazione') VM[k]=_mk(v.flatMap(g=>g.voci));
VM.presenza_pl=_mk([{c:'assente',l:'Assenti'},{c:'presente',l:'Presenti'}]);
const GRP={
  cat_:VOC.gruppi.categoria.map(g=>({c:g.c,l:g.l,m:_mk(g.voci)})),
  pres_:VOC.gruppi.presentazione.map(g=>({c:g.c,l:g.l,m:_mk(g.voci)}))
};
const FIELD={
  forma:{voc:'forma'},facce:{voc:'facce'},scalzo:{voc:'scalzo'},tipsup:{voc:'tipsup'},aspetto:{voc:'aspetto'},
  colsup:{voc:'colore'},colpasta:{voc:'colore'},sottocrosta:{voc:'sottocrosta'},occhiatura:{voc:'occhiatura'},erbor:{voc:'erbor'},
  discont:{voc:'discont'},discont_d:{voc:'dim'},discont_s:{voc:'distr'},strpasta:{voc:'strpasta'},strbocca_o:{voc:'strAltri'},abb_items:{voc:'abbinamenti'},
  forma_r:{voc:'regolarita'},facce_r:{voc:'regolarita'},scalzo_r:{voc:'regolarita'},
  colsup_u:{voc:'uniformita'},colpasta_u:{voc:'uniformita'},colsup_i:{voc:'carica'},colpasta_i:{voc:'carica'},
  sottocrosta_p:{voc:'presenza'},occhiatura_p:{voc:'presenza'},erbor_p:{voc:'presenza'},trig_p:{voc:'presenza'},discont_p:{voc:'presenza_pl'},
  trig_r:{voc:'trig',rate:true},strbocca_r:{voc:'strInt',rate:true},
  odori_int:{scale:true},aromi_int:{scale:true},pers:{scale:true},abb_armonia:{scale:true},
  odori_items:{tree:true},aromi_items:{tree:true}
};
const _mapVal=(val,fn)=>Array.isArray(val)?val.map(fn):fn(val);
function encTree(it){
  const F=VOC.descrittori.find(x=>x.l===it.f);
  const Sx=F&&F.sub.find(x=>x.l===it.s);
  if(!F||!Sx) return {testo:[it.f||'',it.s||'',it.r||'']};
  const o={f:F.c,s:Sx.c};
  const Rx=it.r?Sx.voci.find(x=>x.l===it.r):null;
  if(Rx) o.r=Rx.c; else if(it.r) o.testo=it.r;
  return o;
}
function decTree(o){
  if(!o||typeof o!=='object') return {f:'',s:'',r:''};
  if(Array.isArray(o.testo)) return {f:o.testo[0]||'',s:o.testo[1]||'',r:o.testo[2]||''};
  const F=VOC.descrittori.find(x=>x.c===o.f);
  const Sx=F&&F.sub.find(x=>x.c===o.s);
  if(!F||!Sx) return {f:String(o.f||''),s:String(o.s||''),r:String(o.r||o.testo||'')};
  const Rx=o.r?Sx.voci.find(x=>x.c===o.r):null;
  return {f:F.l,s:Sx.l,r:Rx?Rx.l:(typeof o.testo==='string'?o.testo:'')};
}
function codecValue(k,val,enc){
  const f=FIELD[k];
  if(!f) return val;
  const d=enc?1:-1;
  if(f.scale) return typeof val==='number'?val+d:val;
  if(f.tree) return Array.isArray(val)?val.map(enc?encTree:decTree):val;
  const m=VM[f.voc];
  const fn=enc?(x=>m.enc.has(x)?m.enc.get(x):x):(x=>m.dec.has(x)?m.dec.get(x):x);
  if(f.rate){
    if(!val||typeof val!=='object') return val;
    return Object.fromEntries(Object.entries(val).map(([o,i])=>[fn(o),typeof i==='number'?i+d:i]));
  }
  return _mapVal(val,fn);
}
function codecV(v,enc){
  const out={};
  for(const [k,val] of Object.entries(v||{})){
    if(val===undefined||val===null||k[0]==='_'||k.endsWith('_draft')) continue;
    if(k==='da_riconciliare'){ // gruppi di categoria precompilati dall'Atlante e non ancora confermati
      if(Array.isArray(val)&&val.length) out[k]=val.map(x=>{const g=GRP.cat_.find(g=>(enc?g.l:g.c)===x);return g?(enc?g.c:g.l):x;});
      continue;
    }
    let done=false;
    for(const pre of ['cat_','pres_']){
      if(!k.startsWith(pre)) continue;
      const rest=k.slice(pre.length);
      const g=GRP[pre].find(g=>(enc?g.l:g.c)===rest);
      if(g){
        const fn=enc?(x=>g.m.enc.has(x)?g.m.enc.get(x):x):(x=>g.m.dec.has(x)?g.m.dec.get(x):x);
        out[pre+(enc?g.c:g.l)]=_mapVal(val,fn);done=true;
      }
      break;
    }
    if(!done) out[k]=codecValue(k,val,enc);
  }
  return out;
}
const IMG_OK=/^(https?:\/\/|data:image\/)/i;
function sanitizeV(v){
  for(const k of ['marchio_url','foto_campione']) if(v[k]!==undefined&&(typeof v[k]!=='string'||!IMG_OK.test(v[k]))) delete v[k];
  return v;
}
const encodeSheet=sh=>({step:typeof sh.step==='number'?sh.step:0,updated:sh.updated||Date.now(),created:sh.created||sh.updated||Date.now(),v:codecV(sh.v,true)});
const decodeSheet=sh=>({step:typeof sh.step==='number'?sh.step:0,updated:sh.updated||Date.now(),created:sh.created||sh.updated||Date.now(),v:sanitizeV(codecV(sh&&sh.v,false))});
// Schede salvate dalle versioni precedenti (etichette in chiaro, stato dell'interfaccia mescolato ai dati)
function migrateLegacyV(v){
  if(!v||typeof v!=='object'||Array.isArray(v)) return {};
  if(v._atlas_sel&&!v.rif_onaf){const a=ONAF_ATLAS.find(x=>x.nome===v._atlas_sel);if(a)v.rif_onaf=a.onafId;}
  for(const k of Object.keys(v)) if(k[0]==='_'||k.endsWith('_draft')) delete v[k];
  return sanitizeV(v);
}
function rekeyCache(c){
  const out={};
  for(const [k,u] of Object.entries(c||{})){
    if(typeof u!=='string') continue;
    if(k.startsWith('onaf:')){out[k]=u;continue;}
    const m=ONAF_ATLAS.filter(a=>cleanCheeseName(a.nome).toLowerCase()===k);
    out[m.length===1?'onaf:'+m[0].onafId:k]=u;
  }
  return out;
}

let DB={cur:null,sheets:{},lastBackup:null};
let persistError=false;
(function loadDB(){
  let r3=null;
  try{
    r3=localStorage.getItem(KEY3);
    if(r3){
      const p=JSON.parse(r3);
      if(p&&typeof p==='object'&&p.sheets){
        DB={cur:p.cur||null,sheets:{},lastBackup:p.lastBackup||null,photoCache:p.photoCache||{},marchioCache:p.marchioCache||{}};
        for(const [id,sh] of Object.entries(p.sheets)) DB.sheets[id]=decodeSheet(sh);
      }
      return;
    }
    // Prima apertura dopo l'aggiornamento: migra l'archivio v2 (che resta intatto come copia di sicurezza)
    const r2=localStorage.getItem(KEY2);
    if(r2){
      const p=JSON.parse(r2);
      if(p&&typeof p==='object'&&p.sheets){
        DB={cur:p.cur||null,sheets:{},lastBackup:p.lastBackup||null,photoCache:rekeyCache(p.photoCache),marchioCache:rekeyCache(p.marchioCache)};
        for(const [id,sh] of Object.entries(p.sheets)){
          if(!sh||typeof sh!=='object') continue;
          DB.sheets[id]={step:typeof sh.step==='number'?sh.step:0,updated:sh.updated||Date.now(),created:sh.updated||Date.now(),v:migrateLegacyV(sh.v)};
        }
      }
      return;
    }
    const o=localStorage.getItem(KEY);
    if(o){const id=newId();DB={cur:id,sheets:{[id]:{...fresh(),...JSON.parse(o),updated:Date.now()}},lastBackup:null};}
  }catch(e){
    // Archivio illeggibile: se ne conserva una copia prima che venga sovrascritto
    try{if(r3)localStorage.setItem(KEY3+'-recupero',r3);}catch(e2){}
  }

/* ---------- Calcolo Avanzamento Fasi ---------- */
function phaseDone(id){
  switch(id){
    case 'id': return hasAny('denominazione') && catVal()!=='' && presVal()!=='' && !pendingCat().length;
    case 'vista': return ['forma','facce','scalzo','tipsup','aspetto','colsup'].some(hasAny);
    case 'pasta': return ['colpasta','sottocrosta_p','occhiatura_p','erbor_p','discont_p','strpasta'].some(hasAny);
    case 'olfatto': return hasAny('odori_int') || hasAny('odori_items');
    case 'gusto': return ['dolce','acido','salato','amaro','umami'].some(s=>hasAny('s_'+s)) || hasAny('aromi_int') || hasAny('aromi_items') || hasAny('trig_p') || hasAny('strbocca_r') || hasAny('strbocca_o');
    case 'bocca': return hasAny('pers');
    default: return false;
  }
}
function calcProgress(){
  const mainPhases=['id','vista','pasta','olfatto','gusto','bocca'];
  const doneCount=mainPhases.filter(phaseDone).length;
  return {doneCount, total:mainPhases.length, pct:Math.round((doneCount/mainPhases.length)*100)};
}
function updateProgressUI(){
  const p=calcProgress();
  const bar=document.getElementById('progbar');
  const txt=document.getElementById('progtxt');
  const hn=document.getElementById('hdrname');
  const hr=document.getElementById('hdrric');
  if(bar)bar.style.width=p.pct+'%';
  if(txt)txt.textContent=p.pct+'%';
  if(hn)hn.textContent=get('denominazione','')||'Nuova scheda di degustazione';
  if(hr){
    const ric=get('riconoscimento','');
    if(ric){hr.textContent=ric;hr.className='ric-pill ric-'+ric;hr.style.display='';}
    else{hr.style.display='none';}
  }
}

// Indice veloce per il riconoscimento automatico nei testi
const GLOSS_LOOKUP=(()=>{
  const map=new Map();
  const keys=[];
  ONAF_GLOSSARY.forEach(item=>{
    const allNames=[item.term, ...(item.aliases||[])];
    allNames.forEach(n=>{
      const clean=n.trim();
      if(clean.length>=2){
        map.set(clean.toLowerCase(), item);
        keys.push(clean.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
      }
    });
  });
  // Ordina per lunghezza decrescente per evitare match parziali prematuri (es. "Crosta lavata" prima di "Crosta")
  keys.sort((a,b)=>b.length-a.length);
  const re=new RegExp('\\b('+keys.join('|')+')\\b','gi');
  return {map,re};
})();

// Trasforma una stringa arricchendo i termini del glossario cliccabili
function enrichTextWithGlossary(str,asInfo){
  if(typeof str!=='string' || str.length<4) return [str];
  const re=GLOSS_LOOKUP.re;
  re.lastIndex=0;
  const parts=[];
  let last=0, m;
  while((m=re.exec(str))!==null){
    if(m.index>last) parts.push(str.slice(last,m.index));
    const matchedTxt=m[0];
    const item=GLOSS_LOOKUP.map.get(matchedTxt.toLowerCase());
    if(item&&asInfo){
      parts.push(matchedTxt);
      const ic=document.createElement('span');
      ic.className='gloss-i';
      ic.setAttribute('role','button');
      ic.setAttribute('aria-label','Definizione di '+item.term);
      ic.title='Definizione ONAF: '+item.term;
      ic.textContent='i';
      ic.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();openGlossaryModal(item);});
      parts.push(ic);
    }else if(item){
      const sp=document.createElement('span');
      sp.className='gloss-term';
      sp.title='Definizione ONAF: '+item.term+' (tocca per leggere)';
      sp.textContent=matchedTxt;
      sp.addEventListener('click',ev=>{
        if(sp.closest('button,a')) return; // dentro un pulsante o un link vince l'azione principale
        ev.stopPropagation();
        ev.preventDefault();
        openGlossaryModal(item);
      });
      parts.push(sp);
    }else{
      parts.push(matchedTxt);
    }
    last=m.index+matchedTxt.length;
  }
  if(last===0) return [str];
  if(last<str.length) parts.push(str.slice(last));
  return parts;
}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(k.startsWith('aria-'))e.setAttribute(k,String(v));
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  const noEnrichTags=new Set(['OPTION','TEXTAREA','INPUT','SELECT','SCRIPT','STYLE','TITLE','H4']);
  // Nei pulsanti il testo non intercetta il tocco: solo i chip mostrano una «i» dedicata al glossario
  const isBtn=e.tagName==='BUTTON';
  const isChip=isBtn && e.classList.contains('chip');
  const canEnrich=!noEnrichTags.has(e.tagName) && !(props&&props.class&&String(props.class).includes('no-gloss')) && (!isBtn||isChip);
  kids.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    if(c.nodeType){e.append(c);return;}
    const s=String(c);
    if(canEnrich && typeof GLOSS_LOOKUP!=='undefined'){
      enrichTextWithGlossary(s,isChip).forEach(node=>e.append(typeof node==='string'?document.createTextNode(node):node));
    }else{
      e.append(document.createTextNode(s));
    }
  });
  return e;
}

/* Riconciliazione con il campione: «Degusta» copia dall'Atlante tutte le varianti ammesse per la
   denominazione. I gruppi con più di una voce restano segnalati finché l'assaggiatore non li
   modifica o li conferma per il campione in esame. */
const pendingCat=()=>{const a=S&&S.v?S.v.da_riconciliare:null;return Array.isArray(a)?a.filter(g=>g in CAT):[];};
function resolveCat(g){
  const a=pendingCat().filter(x=>x!==g);
  if(a.length)S.v.da_riconciliare=a;else delete S.v.da_riconciliare;
}
function catPick(){
  const pend=pendingCat();
  return Object.entries(CAT).map(([g,opts])=>{

      chips(opts,get(k,[]),o=>{if(isP)resolveCat(g);toggleMulti(k,o);},true)
    ];
  });
}
function catValFrom(v){
  const a=Object.keys(CAT).map(g=>{
    const val=v['cat_'+g];

    return s?g+': '+s:'';
  }).filter(Boolean);
  if(v['categoria'])a.push(v['categoria']);
  return a.join(' · ');
}
function presValFrom(v){
  const a=Object.keys(PRES).map(g=>{const val=v['pres_'+g];const s=Array.isArray(val)?val.join(', '):val;return s?g+': '+s:'';}).filter(Boolean);
  if(v['pres_origine'])a.push(v['pres_origine']);
  if(v['notepres'])a.push(v['notepres']);
  return a.join(' · ');
}

/* ---------- Radar Chart SVG per i 5 Sapori ---------- */
function buildRadarChart(sapValues){
  const axes=[
    {k:'dolce',label:'Dolce'},
    {k:'acido',label:'Acido'},
    {k:'salato',label:'Salato'},
    {k:'amaro',label:'Amaro'},
    {k:'umami',label:'Umami'}
  ];
  const cx=115, cy=115, maxR=78;
  const angleStep=(Math.PI*2)/axes.length;
  const startAngle=-Math.PI/2;

  const pt=(val,idx)=>{
    const r=(val/5)*maxR;
    const a=startAngle+idx*angleStep;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
  };

  const webs=[1,2,3,4,5].map(lvl=>{
    const pts=axes.map((_,i)=>pt(lvl,i).map(n=>n.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="${lvl===5?1.5:0.8}" stroke-dasharray="${lvl===5?'':'2,2'}"/>`;
  }).join('');

  const spokes=axes.map((ax,i)=>{
    const [x2,y2]=pt(5,i);
    const [lx,ly]=pt(6.15,i);
    const val=sapValues[ax.k];
    const abbr=val!==undefined?ABBR[['Non percettibile',...INT5][val]]:'–';
    return `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
            <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="11" font-weight="600">${ax.label} (${abbr})</text>`;
  }).join('');

  const dataPts=axes.map((ax,i)=>pt(sapValues[ax.k]||0,i));
  const polyStr=dataPts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=dataPts.map((p,i)=>sapValues[axes[i].k]!==undefined
    ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"/>`
    : '').join('');

  const svgWrap=document.createElement('div');
  svgWrap.className='radar-wrap';
  svgWrap.innerHTML=`
    <svg class="radar-svg" viewBox="0 0 230 230" role="img" aria-label="Grafico radar dei sapori">
      ${webs}
      ${spokes}
      <polygon points="${polyStr}" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="radar-legend">
      ${axes.map(ax=>{
        const v=sapValues[ax.k];
        const txt=v===undefined?'Non valutato':['Non percettibile',...INT5][v];
        return `<div><span><b>${ax.label}</b></span><span style="color:var(--muted)">${txt}</span></div>`;
      }).join('')}
    </div>
  `;
  return svgWrap;
}

function isBadWikiThumb(url,pageimage){
  const s=((url||'')+' '+(pageimage||'')).toLowerCase();
  return !url || s.includes('.svg') || s.includes('map') || s.includes('mappa') || s.includes('flag') || s.includes('bandiera') || s.includes('coat_of_arms') || s.includes('stemma') || s.includes('logo') || s.includes('location') || s.includes('locator');
}
async function fetchAutoCheesePhoto(rawName,keyOverride){
  const clean=cleanCheeseName(rawName);
  if(!clean || clean.length<3)return;
  const key=keyOverride||clean.toLowerCase();
  if(AUTO_PHOTO_PENDING[key])return;
  if(getCachedCheesePhoto(key)!=='')return;
  AUTO_PHOTO_PENDING[key]=true;
  try{
    // 1. Ricerca su Wikipedia Italia (API pubblica con CORS origin=*)
    const wpUrl='https://it.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(clean+' formaggio')+'&gsrlimit=4&prop=pageimages&piprop=thumbnail|name&pithumbsize=640&format=json&origin=*';
    const r1=await fetch(wpUrl);
    if(r1.ok){
      const d1=await r1.json();
      const pages=d1&&d1.query&&d1.query.pages ? Object.values(d1.query.pages).sort((a,b)=>(a.index||99)-(b.index||99)) : [];
      for(const p of pages){
        const src=p.thumbnail&&p.thumbnail.source;
        if(src && !isBadWikiThumb(src,p.pageimage)){
          setCachedCheesePhoto(key,src);
          render();
          return;
        }
      }
    }
    // 2. Fallback su Wikimedia Commons (immagini libere di formaggi italiani)
    const cmUrl='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(clean+' cheese OR formaggio')+'&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*';
    const r2=await fetch(cmUrl);
    if(r2.ok){
      const d2=await r2.json();
      const pages=d2&&d2.query&&d2.query.pages ? Object.values(d2.query.pages).sort((a,b)=>(a.index||99)-(b.index||99)) : [];
      for(const p of pages){
        const ii=p.imageinfo&&p.imageinfo[0];
        const src=ii&&(ii.thumburl||ii.url);
        if(src && !isBadWikiThumb(src,p.title)){
          setCachedCheesePhoto(key,src);
          render();
          return;
        }
      }
    }
    // Segna 'NONE' per evitare richieste ripetute inutili nella stessa sessione
    setCachedCheesePhoto(key,'NONE');
  }catch(e){
    // Offline o rete non disponibile: mantiene silenziosamente l'illustrazione vettoriale
  }finally{
    delete AUTO_PHOTO_PENDING[key];
  }
}
